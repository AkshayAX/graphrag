### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

models:
  default_chat_model:
    type: chat
    auth_type: api_key
    api_key: ollama  # Can be any string for Ollama
    model_provider: openai
    model: llama3.1:latest
    api_base: http://localhost:11434/v1
    max_tokens: 4000
    temperature: 0.7
    concurrent_requests: 4

  default_embedding_model:
    type: embedding
    auth_type: api_key
    api_key: ollama  # Can be any string for Ollama
    model_provider: openai
    model: nomic-embed-text:latest
    api_base: http://localhost:11434/v1
    concurrent_requests: 4

# Input configuration
input:
  type: file
  file_type: json
  base_dir: "input"
  encoding: "utf-8"
  document_attribute_columns: ["id", "title", "access_type", "owner_id", "access_domains", "source"]
  text_column: "text"
  title_column: "title"

# Chunk configuration
chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

# Entity extraction
entity_extraction:
  prompt: "prompts/entity_extraction.txt"
  # Comprehensive entity types for Wikipedia-like knowledge base covering all sectors
  entity_types: [
    # Core universal types
    organization,      # Companies, institutions, agencies, NGOs, government bodies
    person,           # People, executives, researchers, authors, leaders
    geo,              # Geographic locations, cities, countries, regions, facilities
    event,            # Events, conferences, incidents, milestones, launches
    technology,       # Software, hardware, AI models, platforms, systems, tools
    product,          # Products, services, offerings, solutions
    concept,          # Abstract ideas, theories, methodologies, frameworks, principles
    industry,         # Sectors, markets, business domains, verticals
    metric,           # KPIs, statistics, measurements, percentages, financial figures
    regulation,       # Laws, policies, standards, compliance requirements, guidelines
    project,          # Initiatives, programs, research projects, campaigns
    patent,           # Intellectual property, inventions, trademarks
    skill,            # Competencies, capabilities, expertise areas, qualifications
    document,         # Reports, papers, publications, studies, specifications
    currency,         # Financial instruments, money, investments, stocks

    # Healthcare sector
    medical_condition,  # Diseases, disorders, syndromes, health conditions
    treatment,          # Therapies, procedures, medical interventions, cures
    drug,              # Medications, pharmaceuticals, vaccines, biologics
    medical_device,    # Medical equipment, implants, diagnostic tools, prosthetics

    # Education sector
    educational_institution,  # Schools, universities, colleges, academies
    degree,                  # Academic qualifications, certifications, diplomas
    course,                  # Classes, training programs, curricula

    # Sports sector
    sport,            # Types of sports, athletic activities, games
    team,             # Sports teams, clubs, national teams, squads
    athlete,          # Players, competitors, sports professionals
    competition,      # Tournaments, leagues, championships, matches
    venue,            # Stadiums, arenas, sports facilities

    # Tourism & hospitality
    destination,      # Tourist destinations, attractions, landmarks, sites
    accommodation,    # Hotels, resorts, lodges, vacation rentals

    # Defense & military
    military_unit,    # Regiments, divisions, forces, battalions
    weapon_system,    # Weapons, defense systems, military equipment

    # Trade & commerce
    commodity         # Traded goods, raw materials, products, resources
  ]
  max_gleanings: 2  # Two extraction passes for better quality

# Local search settings
local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  max_context_tokens: 12000

# Global search settings
global_search:
  max_context_tokens: 12000
  data_max_tokens: 12000
  map_max_tokens: 1000
  reduce_max_tokens: 2000

### Output/storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

output:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

cache:
  type: file # [file, blob, cosmosdb]
  base_dir: "cache"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default

### Workflow settings ###

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  prompt: "prompts/extract_graph.txt"
  # Same comprehensive entity types as entity_extraction (30 total)
  entity_types: [
    # Core universal types (15)
    organization, person, geo, event, technology,
    product, concept, industry, metric, regulation,
    project, patent, skill, document, currency,
    # Healthcare sector (4)
    medical_condition, treatment, drug, medical_device,
    # Education sector (3)
    educational_institution, degree, course,
    # Sports sector (5)
    sport, team, athlete, competition, venue,
    # Tourism sector (2)
    destination, accommodation,
    # Defense sector (2)
    military_unit, weapon_system,
    # Trade sector (1)
    commodity
  ]
  max_gleanings: 2  # Two extraction passes for better quality

summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]
  async_mode: threaded # or asyncio

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: default_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes (embed_graph must also be enabled)

snapshots:
  graphml: false
  embeddings: false

