<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Access Control Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .user-selector {
            margin-bottom: 30px;
        }

        .user-selector label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .user-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .user-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .query-section {
            margin-bottom: 30px;
        }

        .query-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .query-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .query-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .query-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .query-input button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .query-input button:hover {
            transform: translateY(-2px);
        }

        .query-input button:active {
            transform: translateY(0);
        }

        .query-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .result-box.empty {
            color: #999;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-box.error {
            background: #fee;
            border-color: #fcc;
            color: #c00;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #c00;
            margin-bottom: 20px;
        }

        .success-message {
            background: #efe;
            border: 2px solid #cfc;
            border-radius: 8px;
            padding: 15px;
            color: #060;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 GraphRAG Access Control Demo</h1>
            <p>Test role-based access control on knowledge graph queries</p>
        </div>

        <div class="content">
            <!-- Error/Success Messages -->
            <div id="errorMessage" class="error-message hidden"></div>
            <div id="successMessage" class="success-message hidden"></div>

            <!-- User Selector -->
            <div class="user-selector">
                <label for="userRole">Select User Role:</label>
                <select id="userRole" onchange="updateStats()">
                    <option value="guest">Guest (Public Only)</option>
                    <option value="tech_user">Tech User (Technology & Research)</option>
                    <option value="finance_user">Finance User (Finance Domain)</option>
                    <option value="admin">Admin (Full Access)</option>
                </select>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>Accessible Text Units</h3>
                    <div class="value" id="accessibleTextUnits">-</div>
                </div>
                <div class="stat-card">
                    <h3>Accessible Entities</h3>
                    <div class="value" id="accessibleEntities">-</div>
                </div>
                <div class="stat-card">
                    <h3>Accessible Relationships</h3>
                    <div class="value" id="accessibleRelationships">-</div>
                </div>
            </div>

            <!-- Query -->
            <div class="query-section">
                <label for="queryInput">Enter Your Question:</label>
                <div class="query-input">
                    <input
                        type="text"
                        id="queryInput"
                        placeholder="E.g., What companies are mentioned?"
                        onkeypress="if(event.key==='Enter') executeQuery()"
                    >
                    <button onclick="executeQuery()" id="queryButton">Search</button>
                </div>
            </div>

            <!-- Results -->
            <div class="result-box empty" id="resultBox">
                Enter a question above and click Search to see results...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';  // Empty for same origin

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            setTimeout(() => successDiv.classList.add('hidden'), 5000);
        }

        // Update stats for selected user
        async function updateStats() {
            const userRole = document.getElementById('userRole').value;

            try {
                const response = await fetch(`${API_BASE}/api/stats?user_role=${userRole}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                document.getElementById('accessibleTextUnits').textContent =
                    `${data.accessible.text_units} / ${data.total.text_units}`;
                document.getElementById('accessibleEntities').textContent =
                    `${data.accessible.entities} / ${data.total.entities}`;
                document.getElementById('accessibleRelationships').textContent =
                    `${data.accessible.relationships} / ${data.total.relationships}`;

            } catch (error) {
                console.error('Error fetching stats:', error);
                showError(`Failed to load stats: ${error.message}`);
            }
        }

        // Execute query
        async function executeQuery() {
            const userRole = document.getElementById('userRole').value;
            const query = document.getElementById('queryInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const queryButton = document.getElementById('queryButton');

            if (!query) {
                showError('Please enter a question');
                return;
            }

            // Show loading
            resultBox.className = 'result-box loading';
            resultBox.textContent = '🔍 Searching...';
            queryButton.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        user_role: userRole,
                        max_results: 5
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                // Display result
                resultBox.className = 'result-box';
                resultBox.innerHTML = `
                    <strong>Answer:</strong><br><br>
                    ${data.answer}<br><br>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                    <small>
                        <strong>Context Used:</strong>
                        ${data.context_data.text_units} text units,
                        ${data.context_data.entities} entities,
                        ${data.context_data.relationships} relationships
                    </small>
                `;

                showSuccess('Query completed successfully!');

            } catch (error) {
                console.error('Error executing query:', error);
                resultBox.className = 'result-box error';
                resultBox.textContent = `Error: ${error.message}`;
                showError(`Query failed: ${error.message}`);
            } finally {
                queryButton.disabled = false;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Page loaded, checking server health...');

            try {
                // Check if server is responding
                const response = await fetch(`${API_BASE}/api/stats?user_role=guest`);
                if (response.ok) {
                    console.log('Server is healthy!');
                    showSuccess('Connected to GraphRAG server successfully!');
                    updateStats();
                } else {
                    throw new Error(`Server returned ${response.status}`);
                }
            } catch (error) {
                console.error('Server connection error:', error);
                showError(`Cannot connect to server: ${error.message}. Make sure the backend is running.`);
            }
        });
    </script>
</body>
</html>
